include:
  - board: nice_nano/nrf52840/zmk
    shield: sofle_central dongle_display
    artifact-name: panda_sofle_central_display

  - board: nice_nano/nrf52840/zmk
    shield: sofle_left
    artifact-name: panda_sofle_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  - board: nice_nano/nrf52840/zmk
    shield: sofle_right
    artifact-name: panda_sofle_right

  - board: nice_nano/nrf52840/zmk
    shield: settings_reset
    artifact-name: nice_nano_reset
